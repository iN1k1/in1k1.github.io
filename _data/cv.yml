cv:
  name: Niki Martinel
  label: Associate Professor of Machine Learning and Computer Vision
  location: Udine, Italy
  image: prof_pic.jpg
  summary: >-
    Associate Professor at the University of Udine and member of the AVIRES/MLP Labs. Research interests include computer vision, machine learning,
    visual tracking, person and vehicle re-identification, image colorization, food recognition, medical imaging, and super-resolution. Author or
    co-author of more than 20 journal papers, 50 international conference papers, and 3 book chapters.

  social_networks:
